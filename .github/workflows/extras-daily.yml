name: Daily jobs, every six hours

# The tornado archive, Hurritrack, the climate normals and the sea surface temperature.
# Only for starting them by hand (push trigger/daily): on the timetable they run inside the half-hourly job.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["trigger/daily"]

permissions:
  contents: read

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: extras-daily
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - env:
          GWCFC_BASE: ${{ secrets.GWCFC_BASE }}
          GWCFC_UPLOAD_KEY: ${{ secrets.GWCFC_UPLOAD_KEY }}
        run: python3 extras.py --group daily
