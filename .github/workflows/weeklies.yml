name: ECMWF weeklies and seasonal

# Started by the clock every few hours, or by hand. Never on pull requests: code from a fork must not see the secrets.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["trigger/weeklies"]

permissions:
  contents: read

jobs:
  weeklies:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: weeklies
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Run and upload
        env:
          GWCFC_BASE: ${{ secrets.GWCFC_BASE }}
          GWCFC_UPLOAD_KEY: ${{ secrets.GWCFC_UPLOAD_KEY }}
        run: python3 tree.py --job weeklies
