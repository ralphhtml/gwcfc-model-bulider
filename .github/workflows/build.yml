name: Build models

# Started by the clock (clock.yml) with the runs to build, or by hand. Never on pull requests: code from a fork
# must not see the secrets.
on:
  # A push that changes trigger/now builds whatever is due (a way to start one without the Run workflow button).
  push:
    branches: [main]
    paths: ["trigger/now"]
  workflow_dispatch:
    inputs:
      targets:
        description: 'What to build, e.g. [{"t":"hrrr/conus","run":"20261124_02"}] (empty: everything that is due)'
        default: ""
      hours:
        description: "Only these forecast hours, e.g. 0,1,2 (empty: all)"
        default: ""

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      targets: ${{ steps.p.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: inputs.targets == ''
        with:
          python-version: "3.12"
          cache: pip
      - if: inputs.targets == ''
        run: pip install -q -r requirements.txt
      - id: p
        env:
          GWCFC_BASE: ${{ secrets.GWCFC_BASE }}
          GWCFC_UPLOAD_KEY: ${{ secrets.GWCFC_UPLOAD_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          IN_TARGETS: ${{ inputs.targets }}
        run: |
          if [ -z "$IN_TARGETS" ]; then IN_TARGETS="$(python3 clock.py --once | tail -1)"; export IN_TARGETS; fi
          # Only well-formed entries get through: a model region and a run, nothing else.
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json, os, re
          try:
              rows = json.loads(os.environ.get("IN_TARGETS") or "[]")
          except ValueError:
              rows = []
          ok = [{"t": r["t"], "run": r["run"]} for r in rows if isinstance(r, dict)
                and re.fullmatch(r"[a-z0-9]{1,24}/[a-z0-9]{1,24}", str(r.get("t", "")))
                and re.fullmatch(r"\d{8}_\d{2}", str(r.get("run", "")))][:40]
          print("targets=" + json.dumps(ok, separators=(",", ":")))
          PY

  build:
    needs: plan
    if: needs.plan.outputs.targets != '[]' && needs.plan.outputs.targets != ''
    name: build ${{ matrix.t }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.targets) }}
    # One build of a model at a time: a run still being drawn is finished, the next start waits.
    concurrency:
      group: build-${{ matrix.t }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Build and upload
        env:
          GWCFC_BASE: ${{ secrets.GWCFC_BASE }}
          GWCFC_UPLOAD_KEY: ${{ secrets.GWCFC_UPLOAD_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          IN_HOURS: ${{ inputs.hours }}
          TARGET: ${{ matrix.t }}
          RUN: ${{ matrix.run }}
        run: |
          model="${TARGET%%/*}"
          region="${TARGET##*/}"
          args="--model $model --region $region --run $RUN"
          case "$IN_HOURS" in *[!0-9,]*|"") ;; *) args="$args --hours $IN_HOURS" ;; esac
          python3 build.py $args
