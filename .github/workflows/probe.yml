name: Probe

# Lists public NOAA folders, to see what a model's files are called. No secrets.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["trigger/probe"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          N=https://nomads.ncep.noaa.gov/pub/data/nccf/com
          D=$(date -u -d '9 hours ago' +%Y%m%d)
          for c in 00 06 12 18; do
            echo "== refs $D $c: product kinds, count of conus files, last hour"
            curl -s -m 60 -A gwcfc-model-builder "$N/refs/prod/refs.$D/$c/ensprod/" | grep -o 'href="refs[^"]*conus.grib2"' | sed 's/href=//' | tr -d '"' > l.txt
            cut -d. -f3 l.txt | sort | uniq -c | tr '\n' ' '; echo
            cut -d. -f4 l.txt | sort -u | tail -1
          done
          echo "== rrfs $D 12: conus kinds"
          curl -s -m 60 -A gwcfc-model-builder "$N/rrfs/prod/rrfs.$D/12/" | grep -o 'href="rrfs[^"]*grib2"' | sed 's/href=//' | tr -d '"' | awk -F. '{print $3"."$4"."$6}' | sort | uniq -c | tr '\n' ' '; echo
