name: Small jobs, every half hour

# The Waffle House Index, spaghetti plots, satellite winds, the wind field, ACE and the NHC cone archive. Started by the clock.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["trigger/extras"]

permissions:
  contents: read

jobs:
  slow:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    concurrency:
      group: extras-slow
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - env:
          GWCFC_BASE: ${{ secrets.GWCFC_BASE }}
          GWCFC_UPLOAD_KEY: ${{ secrets.GWCFC_UPLOAD_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 extras.py --group slow
          # Four times a day (the half hour after 05, 11, 17 and 23 UTC) the daily jobs follow in this same job: the
          # tornado archive, Hurritrack, the climate normals and the sea surface temperature. In one job, not a
          # workflow of their own, so they never wait behind (or cancel) a half-hourly run, and add no job.
          if [ $((10#$(date -u +%H) % 6)) -eq 5 ] && [ $((10#$(date -u +%M))) -ge 30 ]; then
            python3 extras.py --group daily
          fi
