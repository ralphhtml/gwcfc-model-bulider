name: Small jobs, every half hour

# The Waffle House Index, spaghetti plots, satellite winds, the wind field, ACE and the NHC cone archive. Started by the clock.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["trigger/extras"]

permissions:
  contents: read

jobs:
  slow:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: extras-slow
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - env:
          GWCFC_BASE: ${{ secrets.GWCFC_BASE }}
          GWCFC_UPLOAD_KEY: ${{ secrets.GWCFC_UPLOAD_KEY }}
        run: python3 extras.py --group slow
